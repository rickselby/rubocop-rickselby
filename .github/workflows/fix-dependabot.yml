name: Fix Dependabot gemspec updates

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fix-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base branch script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Fix requirements and release notes
        id: fix_requirements
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: CHANGELOG.md
        run: ruby .github/scripts/fix_dependabot.rb

      - name: Check out updated Dependabot branch
        if: steps.fix_requirements.outputs.gemspec_updated == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Regenerate and commit Gemfile.lock
        if: steps.fix_requirements.outputs.gemspec_updated == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          bundle lock
          git diff --quiet -- Gemfile.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Regenerate Gemfile.lock"
          git push origin "HEAD:${BRANCH}"
