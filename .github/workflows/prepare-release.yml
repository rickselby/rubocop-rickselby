---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v
        required: true
        type: string
      release_notes:
        description: Optional Markdown to append to the release notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Update version and changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ruby .github/scripts/prepare_release.rb

      - name: Run checks
        run: bundle exec rake

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          branch="release/v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md Gemfile.lock lib/rubocop/rickselby/version.rb
          git commit -m "Release v${RELEASE_VERSION}"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "Release v${RELEASE_VERSION}" --body "Prepares v${RELEASE_VERSION} for release. Merge this PR, then push tag v${RELEASE_VERSION}."
